<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="core.css">
</head>

<body>
    <div class="card">
        <h1 class="titl">Wallpapers</h1>
        <p class="hdl">Stuff to stare at (sometimes more than you should)</p>
        <div class="cluster">
            <a class="btn" data-popup-open="insomnia">
                INSOMNIA.
                <span class="material-symbols-outlined">
                    sleep
                </span>
            </a>
        </div>
    </div>
    <div class="banner wallbanner"></div>
    <div class="overlay" data-popup="insomnia">
        <div class="card wall">
            <div class="preview"></div>
            <div class="cluster">
                <a class="btn" href="walls/insomnia.tar">
                    Download
                    <span class="material-symbols-outlined">
                        download
                    </span>
                </a>
                <a class="btn" data-popup-close>
                    <span class="material-symbols-outlined">
                        close
                    </span>
                </a>
            </div>
        </div>
    </div>
    <a href="/index.html" class="close">
        <span class="material-symbols-outlined">
            close
        </span>
    </a>

    <script src="/clickable.js"></script>
    <script src="/round.js"></script>
</body>

</html>
